name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# 同じブランチに続けてpushしたとき、古い実行を打ち切って最新だけを走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型・lint・整形・単体テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nodeのバージョンは .nvmrc に一本化する。CIと手元で別々に指定すると
      # 「手元では通るのにCIで落ちる」が起きる（実際に起きたので固定した）。
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json のとおりに入れる。lockと違う版が入って
      # 「手元では通るのにCIで落ちる」が起きないようにする。
      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: 整形チェック
        run: npm run format:check

      - name: 単体テスト
        run: npm test

      - name: 本番ビルド
        run: npm run build

  migrations:
    name: マイグレーションの検証
    runs-on: ubuntu-latest
    # 使い捨てのPostgreSQLを立てて、そこへ実際にSQLを流す。
    # 本番DBに触れる前に「このSQLは通るのか」をCIで証明するのが目的。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: まっさらなDBへ適用できるか
        env:
          SUPABASE_DB_URL: postgres://postgres:postgres@localhost:5432/verify
        run: node scripts/migrate.mjs

      - name: 二度流しても壊れないか（冪等性）
        env:
          SUPABASE_DB_URL: postgres://postgres:postgres@localhost:5432/verify
        run: node scripts/migrate.mjs

      # 制約を「書いた」ではなく「効いている」ことを毎回確かめる。
      # 実際に不正なデータを入れて弾かれるかを見る。検証データは最後に巻き戻す。
      - name: スキーマの検証
        env:
          SUPABASE_DB_URL: postgres://postgres:postgres@localhost:5432/verify
        run: node scripts/verify-schema.mjs

      # ビューは画面に出る数値そのものを作る。答えが分かっているデータを入れて
      # 期待値と一致するか確かめる。特にキャリアの率がシーズン率の平均になっていないこと。
      - name: ビューの検証
        env:
          SUPABASE_DB_URL: postgres://postgres:postgres@localhost:5432/verify
        run: node scripts/verify-views.mjs

  e2e:
    name: E2Eテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nodeのバージョンは .nvmrc に一本化する。CIと手元で別々に指定すると
      # 「手元では通るのにCIで落ちる」が起きる（実際に起きたので固定した）。
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ブラウザの取得
        run: npx playwright install --with-deps chromium

      - name: E2Eテスト
        run: npm run test:e2e

      - name: 失敗時のレポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
