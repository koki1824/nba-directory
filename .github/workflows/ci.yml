name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# 同じブランチに続けてpushしたとき、古い実行を打ち切って最新だけを走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型・lint・整形・単体テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # package-lock.json のとおりに入れる。lockと違う版が入って
      # 「手元では通るのにCIで落ちる」が起きないようにする。
      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: 整形チェック
        run: npm run format:check

      - name: 単体テスト
        run: npm test

      - name: 本番ビルド
        run: npm run build

  e2e:
    name: E2Eテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ブラウザの取得
        run: npx playwright install --with-deps chromium

      - name: E2Eテスト
        run: npm run test:e2e

      - name: 失敗時のレポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
